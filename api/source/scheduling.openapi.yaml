            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                typical:
                  summary: Business conflict
                  value:
                    title: Business conflict
                    status: 409
                    code: REVISION_CONFLICT
                    correlationId: integration-example-01
        '422':
          description: Business rule rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                typical:
                  summary: Business rule rejected
                  value:
                    title: Business rule rejected
                    status: 422
                    code: BUSINESS_RULE_REJECTED
                    correlationId: integration-example-01
        '503':
          description: Dependency unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                typical:
                  summary: Dependency unavailable
                  value:
                    title: Dependency unavailable
                    status: 503
                    code: DEPENDENCY_UNAVAILABLE
                    correlationId: integration-example-01
        '202':
          description: Reconciliation pending; do not assume rollback or availability. Query the operation with
            the same Idempotency-Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingOperation'
              examples:
                typical:
                  summary: Reconciliation pending; do not assume rollback or availability. Query the operation with
                    the same Idempotency-Key.
                  value:
                    operationId: 11111111-1111-4111-8111-111111111111
                    status: Pending
                    lessonIds:
