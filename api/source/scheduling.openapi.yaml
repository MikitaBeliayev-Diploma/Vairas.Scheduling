components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    workloadBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-to-service token; dedicated audience and workload scope.
  schemas:
    Problem:
      type: object
      required:
      - title
      - status
      - code
      - correlationId
      properties:
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        correlationId:
          type: string
      description: Problem. See the operation descriptions for authorization and lifecycle constraints.
    CreatePracticalLesson:
      type: object
      required:
      - schoolId
      - branchId
      - enrollmentId
      - studentId
      - teacherId
      - vehicleId
      - category
      - startsAt
      - endsAt
      properties:
        schoolId:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        enrollmentId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        teacherId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        category:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
      description: Additional practical lessons use this command; repeated assessments require an assessment appointment
        and Learning Tracking readiness, not a synthetic LessonCompleted credit.
    PracticalLesson:
      type: object
      required:
      - lessonId
      - status
      - version
      properties:
        lessonId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - Scheduled
          - Completed
          - Cancelled
          - NoShow
        version:
          type: integer
          minimum: 1
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        kind:
          type: string
          enum:
          - Practical
          - Theory
        actualStart:
          type:
          - string
          - 'null'
          format: date-time
        actualEnd:
          type:
          - string
          - 'null'
          format: date-time
      description: Lesson view for practical or theory kind; actual fields describe physical elapsed time, never
        credited teaching minutes.
    CompleteLesson:
      type: object
      required:
      - expectedVersion
      - actualStart
      - actualEnd
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        actualStart: &id001
          type: string
          format: date-time
        actualEnd: *id001
      description: 'G-01 local design amendment: persist the verified actual interval with the lifecycle revision.
        Both bounds are required; actualEnd must exceed actualStart and cannot be in the future at acceptance. Planned
        time is never a fallback. Service implementation remains required.'
    DraftInputs:
      type: object
      required:
      - schoolId
      properties:
        schoolId: &id002
          type: string
          format: uuid
        programVersionId: *id002
        enrollmentIds:
          type: array
          items:
            type: string
            format: uuid
        groupIds:
          type: array
          items:
            type: string
            format: uuid
        teacherIds:
          type: array
          items:
            type: string
            format: uuid
        vehicleIds:
          type: array
          items:
            type: string
            format: uuid
        planningStart:
          type: string
          format: date
        planningEnd:
          type: string
          format: date
        ruleVersionIds:
          type: array
          items:
            type: string
            format: uuid
        windows:
          type: array
          items:
            type: object
            required:
            - startsAt
            - endsAt
            properties:
              startsAt: &id003
                type: string
                format: date-time
              endsAt: *id003
            description: Planning window uses UTC instants; conversion from school-local planning dates must handle
              Europe/Vilnius daylight saving.
        preferences:
          type: array
          items:
            type: string
          description: Human-readable preferences are informational draft inputs only. Only published typed rule
            versions can affect generation; unparsed strings cannot enforce policy.
        expectedRevision:
          type: integer
          minimum: 1
        draftRevision:
          type: integer
          minimum: 1
          description: Draft input version; PUT compares expectedRevision to the current revision.
      description: Incomplete fields allowed only in Draft. Submission requires programme, same-school enrollments/groups/resources,
        time windows and verified applicable rules. PUT additionally requires expectedRevision.
    SchedulingRequest:
      type: object
      required:
      - requestId
      - revision
      - schoolId
      - status
      - missingItems
      properties:
        requestId: &id004
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        schoolId: *id004
        status:
          type: string
          enum:
          - Draft
          - Submitted
          - Ready
          - Infeasible
          - Rejected
          - Stale
          - Superseded
          - Confirmed
        missingItems:
          type: array
          items:
            type: string
      description: Scheduling Request. See the operation descriptions for authorization and lifecycle constraints.
    ExpectedRevision:
      type: object
      required:
      - expectedRevision
      properties:
        expectedRevision:
          type: integer
          minimum: 1
      description: Expected Revision. See the operation descriptions for authorization and lifecycle constraints.
    ScheduleProposal:
      type: object
      required:
      - requestId
      - revision
      - status
      - lessons
      - issues
      - theoryLessons
      properties:
        requestId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - Ready
          - Infeasible
          - Stale
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/CreatePracticalLesson'
        issues:
          type: array
          items:
            type: string
        theoryLessons:
          type: array
          items:
            $ref: '#/components/schemas/TheoryLesson'
      description: Schedule Proposal. See the operation descriptions for authorization and lifecycle constraints.
    SchedulingOperation:
      type: object
      required:
      - operationId
      - status
      - lessonIds
      properties:
        operationId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - Pending
          - Committed
          - Rejected
          - ReconciliationPending
        lessonIds:
          type: array
          items:
            type: string
            format: uuid
      description: Scheduling Operation. See the operation descriptions for authorization and lifecycle constraints.
    RescheduleLesson:
      type: object
      required:
      - expectedVersion
      - startsAt
      - endsAt
      - reason
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        startsAt: &id005
          type: string
          format: date-time
        endsAt: *id005
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: .*\S.*
      description: Reschedule Lesson. See the operation descriptions for authorization and lifecycle constraints.
    CancelLesson:
      type: object
      required:
      - expectedVersion
      - reason
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
      description: Cancel Lesson. See the operation descriptions for authorization and lifecycle constraints.
    Availability:
      type: object
      required:
      - schoolId
      - slots
      properties:
        schoolId:
          type: string
          format: uuid
        slots:
          type: array
          items:
            type: object
            required:
            - startsAt
            - endsAt
            - teacherId
            - vehicleId
            properties:
              startsAt: &id006
                type: string
                format: date-time
              endsAt: *id006
              teacherId: &id007
                type: string
                format: uuid
              vehicleId: *id007
      description: Availability. See the operation descriptions for authorization and lifecycle constraints.
    LessonList:
      type: array
      items:
        $ref: '#/components/schemas/PracticalLesson'
      description: Lesson List. See the operation descriptions for authorization and lifecycle constraints.
    TheoryLesson:
      type: object
      required:
      - schoolId
      - groupId
      - teacherId
      - classroomId
      - startsAt
      - endsAt
      properties:
        schoolId: &id008
          type: string
          format: uuid
        groupId: *id008
        teacherId: *id008
        classroomId: *id008
        startsAt: &id009
          type: string
          format: date-time
        endsAt: *id009
      description: Theory Lesson. See the operation descriptions for authorization and lifecycle constraints.
    SchoolRestriction:
      type: object
      required:
      - schoolId
      - ruleType
      - value
      - expectedRevision
      properties:
        schoolId:
          type: string
          format: uuid
        ruleType:
          type: string
          description: Canonical implemented rule catalogue code; unknown codes rejected. Only the four supported
            School rule types may be used; this contract does not invent their catalogue values.
          example: MAX_LESSONS_PER_STUDENT_PER_DAY
        value:
          type: integer
          minimum: 1
        expectedRevision:
          type: integer
          minimum: 1
        unit:
          type: string
        scopeKind:
          type: string
          enum:
          - School
          - Instructor
          - Vehicle
          - Branch
          - Group
          - Student
        effectiveFrom:
          type: string
          format: date-time
        sourceReference:
          type: string
      description: Wire catalogue code must resolve to an implemented School rule. The repository synthetic seed
        confirms MAX_LESSONS_PER_STUDENT_PER_DAY with unit Lessons; remaining catalogue codes require owner confirmation,
        not arbitrary string execution.
    RuleVersion:
      type: object
      required:
      - ruleVersionId
      - revision
      - status
      properties:
        ruleVersionId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - Pending
          - Verified
          - Rejected
      description: Rule Version. See the operation descriptions for authorization and lifecycle constraints.
    AssessmentAppointment:
      type: object
      required:
      - schoolId
      - enrollmentId
      - assessmentDefinitionVersionId
      - readinessEvaluationId
      - teacherId
      - startsAt
      - endsAt
      properties:
        schoolId: &id010
          type: string
          format: uuid
        enrollmentId: *id010
        assessmentDefinitionVersionId: *id010
        readinessEvaluationId: *id010
        teacherId: *id010
        startsAt: &id011
          type: string
          format: date-time
        endsAt: *id011
    ReviseDraftInputs:
      allOf:
      - $ref: '#/components/schemas/DraftInputs'
      - type: object
        required:
        - expectedRevision
    TrainingSource:
      type: object
      required:
      - lessonId
      - schoolId
      - lessonRevision
      - kind
      - physicallyCompleted
      - sourceValid
      - actualStart
      - actualEnd
      - groupMembershipRevision
      - teacherId
      - enrollmentId
      - studentId
      - vehicleId
      - groupId
      properties:
        lessonId: &id012
          type: string
          format: uuid
        schoolId: *id012
        lessonRevision:
          type: integer
          minimum: 1
        kind:
          type: string
          enum:
          - Practical
          - Theory
        physicallyCompleted:
          type: boolean
        sourceValid:
          type: boolean
        actualStart:
          type:
          - string
          - 'null'
          format: date-time
        actualEnd:
          type:
          - string
          - 'null'
          format: date-time
        groupMembershipRevision:
          type:
          - integer
          - 'null'
          minimum: 1
        teacherId:
          type: string
          format: uuid
          description: Maps to Learning instructor_id.
        enrollmentId:
          type:
          - string
          - 'null'
          format: uuid
        studentId:
          type:
          - string
          - 'null'
          format: uuid
        vehicleId:
          type:
          - string
          - 'null'
          format: uuid
        groupId:
          type:
          - string
          - 'null'
          format: uuid
      allOf:
      - if:
          properties:
            physicallyCompleted:
              const: true
            sourceValid:
              const: true
          required:
          - physicallyCompleted
          - sourceValid
        then:
          properties:
            actualStart: *id001
            actualEnd: *id001
      - oneOf:
        - properties:
            actualStart:
              type: 'null'
            actualEnd:
              type: 'null'
        - properties:
            actualStart:
              type: string
              format: date-time
            actualEnd:
              type: string
              format: date-time
      - if:
          properties:
            kind:
              const: Practical
        then:
          properties:
            enrollmentId:
              type: string
            studentId:
              type: string
            vehicleId:
              type: string
            groupId:
              type: 'null'
            groupMembershipRevision:
              type: 'null'
        else:
          properties:
            enrollmentId:
              type: 'null'
            studentId:
              type: 'null'
            vehicleId:
              type: 'null'
            groupId:
              type: string
            groupMembershipRevision:
              type: integer
      description: Exact Scheduling identity and physical state for lessonRevision. Both actual bounds null or strictly
        increasing (service check); Completed without verified actuals is never sourceValid. Practical requires
        enrollment/student/vehicle and null group/membership. Theory requires group/membership and null practical
        identities.
    CorrectLessonActualInterval:
      type: object
      required:
      - expectedVersion
      - actualStart
      - actualEnd
      - reason
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        actualStart: &id013
          type: string
          format: date-time
        actualEnd: *id013
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: .*\S.*
      description: Completed lesson interval correction; a nonblank audit reason and expected revision are mandatory.
        No automatic re-credit.
