        required: true
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
        description: Stable operation identity bound to exact actor, school, target and payload. Exact retries reuse
          the result; conflicting reuse returns 409.
      x-status: proposed-provider-design-amended-G-01
      description: Assigned teacher completes a Scheduled practical lesson with verified actualStart/actualEnd and
        expectedVersion. Enforce increasing, non-future actual time, exact school/lesson authority and CAS. Atomically
        append OLD state including actuals, persist Completed and a new revision, and enqueue LessonCompleted in
        an Outbox. Exact Idempotency-Key retries return the prior outcome; different payload or stale revision returns
        409. Completion alone never credits minutes. G-01 storage is included in the local design; provider is not
        implemented.
      tags:
      - scheduling
      x-negative-request:
        description: 'Missing required expectedVersion: reject with 400 before business work.'
        mediaType: application/json
        value: {}
        expectedStatus: 400
