components:
  schemas:
    IntegrationHeaders:
      type: object
      additionalProperties: false
      description: Application headers only; broker protocol-level delivery headers are transport-specific.
      required:
      - eventId
      - eventType
      - eventVersion
      - occurredAt
      - producer
      - correlationId
      - aggregateId
      - aggregateVersion
      properties:
        eventId: &id002
          type: string
          format: uuid
        eventType: &id001
          type: string
          minLength: 1
        eventVersion:
          type: integer
          const: 1
        occurredAt:
          type: string
          format: date-time
        producer:
          type: string
          enum:
          - school
          - scheduling
          - vehicle
          - learning
          - documents
          - notifications
          - user
        correlationId: *id001
        causationId: *id001
        aggregateId: *id002
        aggregateVersion:
          type: integer
          minimum: 1
        traceparent: *id001
    LessonCancelledPayload:
      type: object
      description: Lesson cancelled. Recipients must suppress older queued reminders; already-in-flight messages
        may still be sent.
      additionalProperties: false
      required:
      - schoolId
      - lessonId
      - lessonKind
      - teacherId
      - cancelledAt
      properties:
        schoolId: &id003
          type: string
          format: uuid
        lessonId: *id003
        lessonKind:
          type: string
          enum:
          - Practical
          - Theory
        teacherId: *id003
        enrollmentId: *id003
        groupId: *id003
        vehicleId: *id003
        cancelledAt:
          type: string
          format: date-time
      allOf:
      - if:
          properties:
            lessonKind:
              const: Practical
          required:
          - lessonKind
        then:
          required:
          - enrollmentId
          - vehicleId
        else:
          required:
          - groupId
    LessonCompletedPayload:
      type: object
      description: Scheduling completed lifecycle, also emitted at a new aggregateVersion after an actual-interval correction. Fetch current training-source for actual bounds and identity; planned startsAt/endsAt are not actuals. Never grants credit. Theory additionally requires verified attendance and confirmation.
      additionalProperties: false
      required:
      - schoolId
      - lessonId
      - lessonKind
      - teacherId
      - startsAt
      - endsAt
      - scheduledDurationMinutes
      properties:
        schoolId: &id004
          type: string
          format: uuid
        lessonId: *id004
        lessonKind:
          type: string
          enum:
          - Practical
          - Theory
        teacherId: *id004
        enrollmentId: *id004
        groupId: *id004
        vehicleId: *id004
        startsAt: &id005
          type: string
          format: date-time
        endsAt: *id005
        scheduledDurationMinutes:
          type: integer
          minimum: 1
      allOf:
      - if:
          properties:
            lessonKind:
              const: Practical
          required:
          - lessonKind
        then:
          required:
          - enrollmentId
          - vehicleId
        else:
          required:
          - groupId
    LessonRescheduledPayload:
      type: object
      description: A lesson has a new time slot. Source aggregateVersion strictly increases, so stale reminder events
        may be ignored.
      additionalProperties: false
      required:
      - schoolId
      - lessonId
      - lessonKind
      - teacherId
      - startsAt
      - endsAt
      - previousStartsAt
      - previousEndsAt
      properties:
        schoolId: &id006
          type: string
          format: uuid
        lessonId: *id006
        lessonKind:
          type: string
          enum:
          - Practical
          - Theory
        teacherId: *id006
        enrollmentId: *id006
        groupId: *id006
        vehicleId: *id006
        startsAt: &id007
          type: string
          format: date-time
        endsAt: *id007
        previousStartsAt: *id007
        previousEndsAt: *id007
      allOf:
      - if:
          properties:
            lessonKind:
              const: Practical
          required:
          - lessonKind
        then:
          required:
          - enrollmentId
          - vehicleId
        else:
          required:
          - groupId
    LessonScheduledPayload:
      type: object
      description: Scheduled lesson persisted. Participant identifiers only; recipients resolved with school authorization.
      additionalProperties: false
      required:
      - schoolId
      - lessonId
      - lessonKind
      - startsAt
      - endsAt
      - teacherId
      properties:
        schoolId: &id008
          type: string
          format: uuid
        lessonId: *id008
        lessonKind:
          type: string
          enum:
          - Practical
          - Theory
        startsAt: &id009
          type: string
          format: date-time
        endsAt: *id009
        teacherId: *id008
        enrollmentId: *id008
        groupId: *id008
        vehicleId: *id008
      allOf:
      - if:
          properties:
            lessonKind:
              const: Practical
          required:
          - lessonKind
        then:
          required:
          - enrollmentId
          - vehicleId
        else:
          required:
          - groupId
    MaintenanceCompletedPayload:
      type: object
      description: Maintenance ended; does not independently mean vehicle is active or a Scheduling block was safely
        released.
      additionalProperties: false
      required:
      - schoolId
      - vehicleId
      - maintenanceId
      - completedAt
      properties:
        schoolId: &id010
          type: string
          format: uuid
        vehicleId: *id010
        maintenanceId: *id010
        completedAt:
          type: string
          format: date-time
    MaintenanceStartedPayload:
      type: object
      description: Maintenance actually started after a successful planned-maintenance Saga, or under the separately
        audited emergency procedure.
      additionalProperties: false
      required:
      - schoolId
      - vehicleId
      - maintenanceId
      - effectiveAt
      - operationId
      - mode
      properties:
        schoolId: &id011
          type: string
          format: uuid
        vehicleId: *id011
        maintenanceId: *id011
        effectiveAt:
          type: string
          format: date-time
        operationId: *id011
        mode:
          type: string
          enum:
          - Planned
          - Emergency
    SchoolMembershipEndedPayload:
      type: object
      description: 'User lost school membership. Event-driven caches are advisory: sensitive writes still require
        authoritative permission checks.'
      additionalProperties: false
      required:
      - schoolId
      - membershipId
      - userId
      - role
      - endedAt
      properties:
        schoolId: &id012
          type: string
          format: uuid
        membershipId: *id012
        userId: *id012
        role:
          type: string
          enum:
          - Student
          - Teacher
          - Administrator
        endedAt:
          type: string
          format: date-time
    StudentAssignedToGroupPayload:
      type: object
      description: An enrollment joined a group. EnrollmentId, not StudentId alone, defines the membership.
      additionalProperties: false
      required:
      - schoolId
      - enrollmentId
      - groupId
      - effectiveAt
      properties:
        schoolId: &id013
          type: string
          format: uuid
        enrollmentId: *id013
        groupId: *id013
        effectiveAt:
          type: string
          format: date-time
    StudentEnrollmentCompletedPayload:
      type: object
      description: An enrollment has reached Completed, which differs from an early/exceptional end.
      additionalProperties: false
      required:
      - schoolId
      - enrollmentId
      - completedAt
      properties:
        schoolId: &id014
          type: string
          format: uuid
        enrollmentId: *id014
        completedAt:
          type: string
          format: date-time
    StudentEnrollmentEndedPayload:
      type: object
      description: An enrollment has ended as withdrawn/transferred/cancelled; affected future lessons require review,
        not silent deletion.
      additionalProperties: false
      required:
      - schoolId
      - enrollmentId
      - endReason
      - endedAt
      properties:
        schoolId: &id015
          type: string
          format: uuid
        enrollmentId: *id015
        endReason:
          type: string
          enum:
          - Withdrawn
          - Transferred
          - Cancelled
        endedAt:
          type: string
          format: date-time
    StudentEnrollmentStartedPayload:
      type: object
      description: Enrollment is created and active; Learning may initialize StudentTraining, Scheduling may refresh
        eligibility projection.
      additionalProperties: false
      required:
      - schoolId
      - enrollmentId
      - studentId
      - drivingLicenseCategory
      - startedAt
      properties:
        schoolId: &id016
          type: string
          format: uuid
        enrollmentId: *id016
        studentId: *id016
        drivingLicenseCategory:
          type: string
          minLength: 1
        startedAt:
          type: string
          format: date-time
    StudentRemovedFromGroupPayload:
      type: object
      description: An enrollment ceased to belong to a group; consumers must not infer past attendance from current
        membership.
      additionalProperties: false
      required:
      - schoolId
      - enrollmentId
      - groupId
      - effectiveAt
      properties:
        schoolId: &id017
          type: string
          format: uuid
        enrollmentId: *id017
        groupId: *id017
        effectiveAt:
          type: string
          format: date-time
    TeacherAssignedToGroupPayload:
      type: object
      description: A teacher was assigned to a training group; not proof of real-time permission at booking confirmation.
      additionalProperties: false
      required:
      - schoolId
      - groupId
      - teacherId
      - assignedAt
      properties:
        schoolId: &id018
          type: string
          format: uuid
        groupId: *id018
        teacherId: *id018
        assignedAt:
          type: string
          format: date-time
    UserDeactivatedPayload:
      type: object
      description: User account business status deactivated globally. Does not by itself revoke already-valid sessions;
        enforce authoritative security gates.
      additionalProperties: false
      required:
      - userId
      - deactivatedAt
      properties:
        userId:
          type: string
          format: uuid
        deactivatedAt:
          type: string
          format: date-time
    VehicleActivatedPayload:
      type: object
      description: Vehicle operational state is Active, but Scheduling must not release its booking gate merely
        because this event was received.
      additionalProperties: false
      required:
      - schoolId
      - branchId
      - vehicleId
      - effectiveAt
      properties:
        schoolId: &id019
          type: string
          format: uuid
        branchId: *id019
        vehicleId: *id019
        effectiveAt:
          type: string
          format: date-time
    VehicleDeactivatedPayload:
      type: object
      description: Vehicle became operationally Inactive. Emergency deactivation is authoritative in Vehicle; an
        event alone is not an atomic booking fence.
      additionalProperties: false
      required:
      - schoolId
      - branchId
      - vehicleId
      - effectiveAt
      - reason
      properties:
        schoolId: &id020
          type: string
          format: uuid
        branchId: *id020
        vehicleId: *id020
        effectiveAt:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
  messages:
    LessonCancelled:
      name: LessonCancelled
      title: LessonCancelled v1
      summary: Lesson cancelled. Recipients must suppress older queued reminders; already-in-flight messages may
        still be sent.
      contentType: application/json
      headers:
        $ref: '#/components/schemas/IntegrationHeaders'
      payload:
        $ref: '#/components/schemas/LessonCancelledPayload'
      correlationId:
        location: $message.header#/correlationId
      examples:
      - name: sampleLessonCancelled
        headers:
          eventId: 20000000-0000-4000-8000-000000000001
          eventType: LessonCancelled
          eventVersion: 1
          occurredAt: '2026-11-15T16:00:00Z'
          producer: scheduling
          correlationId: corr-2026-11-15-001
          aggregateId: 10000000-0000-4000-8000-000000000012
          aggregateVersion: 3
        payload:
          schoolId: 10000000-0000-4000-8000-000000000001
          lessonId: 10000000-0000-4000-8000-000000000012
          lessonKind: Practical
          teacherId: 10000000-0000-4000-8000-000000000005
          enrollmentId: 10000000-0000-4000-8000-000000000002
          vehicleId: 10000000-0000-4000-8000-000000000009
          cancelledAt: '2026-11-18T14:00:00Z'
      x-contract-status: Base DDD event; integration payload proposed
    LessonCompleted:
      name: LessonCompleted
      title: LessonCompleted v1
      summary: Scheduling lesson lifecycle completed. NOT proof of confirmed practical hours. Theory credit additionally
        requires the verified full roster and current-version assigned-teacher confirmation.
      contentType: application/json
      headers:
        $ref: '#/components/schemas/IntegrationHeaders'
      payload:
        $ref: '#/components/schemas/LessonCompletedPayload'
      correlationId:
        location: $message.header#/correlationId
      examples:
      - name: sampleLessonCompleted
        headers:
          eventId: 20000000-0000-4000-8000-000000000001
          eventType: LessonCompleted
          eventVersion: 1
          occurredAt: '2026-11-15T16:00:00Z'
          producer: scheduling
          correlationId: corr-2026-11-15-001
          aggregateId: 10000000-0000-4000-8000-000000000012
          aggregateVersion: 3
        payload:
          schoolId: 10000000-0000-4000-8000-000000000001
          lessonId: 10000000-0000-4000-8000-000000000012
          lessonKind: Practical
          teacherId: 10000000-0000-4000-8000-000000000005
          enrollmentId: 10000000-0000-4000-8000-000000000002
          vehicleId: 10000000-0000-4000-8000-000000000009
          startsAt: '2026-11-20T10:00:00Z'
          endsAt: '2026-11-20T11:30:00Z'
          scheduledDurationMinutes: 90
      x-contract-status: Base DDD event; integration payload proposed
    LessonRescheduled:
      name: LessonRescheduled
      title: LessonRescheduled v1
      summary: A lesson has a new time slot. Source aggregateVersion strictly increases, so stale reminder events
        may be ignored.
      contentType: application/json
      headers:
        $ref: '#/components/schemas/IntegrationHeaders'
      payload:
        $ref: '#/components/schemas/LessonRescheduledPayload'
      correlationId:
        location: $message.header#/correlationId
      examples:
      - name: sampleLessonRescheduled
        headers:
          eventId: 20000000-0000-4000-8000-000000000001
          eventType: LessonRescheduled
          eventVersion: 1
          occurredAt: '2026-11-15T16:00:00Z'
          producer: scheduling
          correlationId: corr-2026-11-15-001
          aggregateId: 10000000-0000-4000-8000-000000000012
          aggregateVersion: 3
        payload:
          schoolId: 10000000-0000-4000-8000-000000000001
          lessonId: 10000000-0000-4000-8000-000000000012
          lessonKind: Practical
          teacherId: 10000000-0000-4000-8000-000000000005
          enrollmentId: 10000000-0000-4000-8000-000000000002
          vehicleId: 10000000-0000-4000-8000-000000000009
          startsAt: '2026-11-20T10:00:00Z'
          endsAt: '2026-11-20T11:30:00Z'
          previousStartsAt: '2026-11-19T10:00:00Z'
          previousEndsAt: '2026-11-19T11:30:00Z'
      x-contract-status: Base DDD event; integration payload proposed
    LessonScheduled:
      name: LessonScheduled
      title: LessonScheduled v1
      summary: Scheduled lesson persisted. Participant identifiers only; recipients resolved with school authorization.
      contentType: application/json
      headers:
        $ref: '#/components/schemas/IntegrationHeaders'
      payload:
        $ref: '#/components/schemas/LessonScheduledPayload'
      correlationId:
        location: $message.header#/correlationId
      examples:
      - name: sampleLessonScheduled
        headers:
          eventId: 20000000-0000-4000-8000-000000000001
          eventType: LessonScheduled
          eventVersion: 1
          occurredAt: '2026-11-15T16:00:00Z'
          producer: scheduling
          correlationId: corr-2026-11-15-001
          aggregateId: 10000000-0000-4000-8000-000000000012
          aggregateVersion: 3
        payload:
          schoolId: 10000000-0000-4000-8000-000000000001
          lessonId: 10000000-0000-4000-8000-000000000012
          lessonKind: Practical
          startsAt: '2026-11-19T10:00:00Z'
          endsAt: '2026-11-19T11:30:00Z'
          teacherId: 10000000-0000-4000-8000-000000000005
          enrollmentId: 10000000-0000-4000-8000-000000000002
          vehicleId: 10000000-0000-4000-8000-000000000009
      x-contract-status: Base DDD event; integration payload proposed
    MaintenanceCompleted:
      name: MaintenanceCompleted
      title: MaintenanceCompleted v1
      summary: Maintenance ended; does not independently mean vehicle is active or a Scheduling block was safely
        released.
      contentType: application/json
      headers:
        $ref: '#/components/schemas/IntegrationHeaders'
      payload:
        $ref: '#/components/schemas/MaintenanceCompletedPayload'
      correlationId:
        location: $message.header#/correlationId
      examples:
      - name: sampleMaintenanceCompleted
        headers:
          eventId: 20000000-0000-4000-8000-000000000001
          eventType: MaintenanceCompleted
          eventVersion: 1
          occurredAt: '2026-11-15T16:00:00Z'
          producer: vehicle
          correlationId: corr-2026-11-15-001
          aggregateId: 10000000-0000-4000-8000-000000000010
          aggregateVersion: 3
        payload:
          schoolId: 10000000-0000-4000-8000-000000000001
