asyncapi: 3.0.0
info:
  title: Vairas — Scheduling Integration Events
  version: 0.1.0
  description: PROPOSED AsyncAPI 3.0.0 contract for Scheduling. Events are reliable at-least-once messages; see
    README for exact publishing, ordering, privacy and recovery semantics. This is a proposed inter-service payload,
    not a claim of implemented integration.
defaultContentType: application/json
